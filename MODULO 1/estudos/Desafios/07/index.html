<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagem flexível</title>
</head>
<body>
    <h1>Imagem flexível</h1>
    <p> Você esta vendo a imagem completa, experimente ampliar o tamanho da sua janela para aproveitara melhor esperiência</p>

    <picture>
        <source media="(max-width:700px )"srcset="imagem/foto-p.png" type="image/png">
        <source media="(max-width:1000px)"srcset="imagem/foto-m.png" type="image/png">
        <img src="imagem/foto-g.png" alt="imagem plexivel">
    </picture>
</body>
</html>
