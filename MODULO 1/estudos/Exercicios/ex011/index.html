<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagens Dinâmicas</h1>
    <p>Tente abrir esse site em vários dispositivos diferente ou simplesmente aumente e diminua o tamanho do seu navegador.</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagem flexível">
    </picture>
    <h1>Reproduzindo Áudios</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5</p>
    <audio src="midia/good-morning.mp3" controls ></audio><!--mp3 wav ogg-->
    <audio preload="metadata"  controls loop>
<source src="midia/good-morning.mp3" type="audio/mpeg">
<source src="midia/good-morning.ogg" type="audio/ogg">
<source src="midia/good-morning.wav" type="audio/wav">
<p>Infelizmente seu navegador não consegue reproduzir áudio.
<a href="midia/good-morning.mp3">Clique aqui</a></p>
    </audio>
<p>Infelizmente seu navegador não consegue reproduzir áudio.<a href="midia/good-morning.mp3">Clique aqui para baixar o Arquivo</a></p>
</body>
</html>
