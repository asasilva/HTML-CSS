<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos em HTML</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmento</h1>
    <p>Este video está hospedado no meu próprio servidor</p>
   <video width="400px" poster="imagens/tumb.png" controls >
    <source src="midia/meu-video.mp4" type="videos/mp4">
    <source src="midia/meu-video.m4v" type="videos/mp4">
    <source src="midia/meu-video.webm" type="videos/webm">
    <source src="midia/meu-video.ogv" type="videos/ogg">
    <p>Seu navegador nõa tem compatibilidade com reproducao de vídeos</p>
   </video>

   <video width="500px" poster="imagens/tumb.png"controls src="midia/meu-video.mp4"></video>

   <h1>Inserindo vídeos do youtube</h1>
   <iframe width="500" height="315" src="https://www.youtube.com/embed/au30Dogtj-I?si=Hyg0n85Sw0ky0Adr" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

</body>
</html>
